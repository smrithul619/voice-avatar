<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Avatar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#10131a;color:#fff;min-height:100vh}
.app{max-width:700px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 18px 8px;text-align:center;font-size:22px;font-weight:700}
#status{text-align:center;color:#aeb7c7;font-size:14px;padding:4px 18px 10px}
.avatar-wrap{display:flex;justify-content:center;padding:10px 0 18px}
.avatar{width:190px;height:210px;border-radius:48% 48% 45% 45%;background:#ffd1ad;position:relative;border:3px solid #e8ae89;box-shadow:0 12px 35px #0008}
.hair{position:absolute;left:-3px;right:-3px;top:-3px;height:68px;background:#3a241e;border-radius:50% 50% 30% 30%}
.eye{position:absolute;top:88px;width:15px;height:20px;background:#241914;border-radius:50%}.e1{left:49px}.e2{right:49px}
.nose{position:absolute;top:111px;left:91px;width:9px;height:18px;border-left:3px solid #d79772;border-radius:50%}
.mouth{position:absolute;top:151px;left:61px;width:68px;height:12px;background:#6d2433;border-radius:50%;transition:.08s}
.speaking .mouth{height:28px;transform:scaleY(1.15)}
.ear{position:absolute;top:100px;width:18px;height:38px;background:#f2bd99;border-radius:50%}.ear.l{left:-13px}.ear.r{right:-13px}
#chat{flex:1;padding:10px 15px;overflow:auto}
.msg{max-width:85%;padding:12px 14px;margin:8px 0;border-radius:17px;line-height:1.4;white-space:pre-wrap}
.user{margin-left:auto;background:#3156c9}.ai{background:#242a35}
.controls{display:flex;gap:8px;padding:12px 12px 18px;background:#10131a;position:sticky;bottom:0}
input{flex:1;min-width:0;padding:13px;border-radius:14px;border:1px solid #414a5b;background:#1b202a;color:#fff;font-size:16px}
button{border:0;border-radius:14px;padding:0 16px;font-size:16px;font-weight:700;background:#4d6cff;color:#fff}
#mic{width:52px;padding:0;font-size:22px}button:disabled{opacity:.5}
small{display:block;text-align:center;color:#818b9c;padding-bottom:5px}
</style>
</head>
<body>
<div class="app">
<header>🎙️ Voice Avatar</header>
<div id="status">Tap the microphone and speak.</div>
<div class="avatar-wrap"><div id="avatar" class="avatar">
<div class="hair"></div><div class="ear l"></div><div class="ear r"></div>
<div class="eye e1"></div><div class="eye e2"></div><div class="nose"></div><div class="mouth"></div>
</div></div>
<div id="chat"></div>
<small>Speech recognition and speech output use your browser/device.</small>
<div class="controls">
<button id="mic">🎤</button>
<input id="text" placeholder="Speak or type..." autocomplete="off">
<button id="send">Send</button>
</div>
</div>
<script>
const chat=document.querySelector('#chat'), input=document.querySelector('#text'), status=document.querySelector('#status');
const avatar=document.querySelector('#avatar'), mic=document.querySelector('#mic'), send=document.querySelector('#send');

function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function speak(text){
 if(!('speechSynthesis' in window)){status.textContent='Speech output is not supported by this browser.';return}
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.95;
 u.onstart=()=>{status.textContent='Speaking...';avatar.classList.add('speaking')};
 u.onend=()=>{status.textContent='Tap the microphone and speak.';avatar.classList.remove('speaking')};
 speechSynthesis.speak(u);
}
function localReply(text){
 const t=text.toLowerCase();
 if(t.includes('hello')||t.includes('hi')) return 'Hello! I can hear you. This is the first version of your voice avatar.';
 if(t.includes('how are')) return 'I am doing well. What would you like to talk about?';
 return 'I heard you say: '+text;
}
async function sendText(){
 const text=input.value.trim(); if(!text)return; input.value='';
 add(text,'user'); status.textContent='Thinking...'; send.disabled=true;
 // Demo mode: no API key required. Replace localReply() with your preferred AI API later.
 const reply=localReply(text); add(reply,'ai'); speak(reply); send.disabled=false;
}
send.onclick=sendText; input.addEventListener('keydown',e=>{if(e.key==='Enter')sendText()});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(SR){
 rec=new SR(); rec.lang='en-IN'; rec.interimResults=true; rec.continuous=false;
 rec.onstart=()=>{status.textContent='Listening...';mic.textContent='⏹️'};
 rec.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;input.value=s;
   if(e.results[e.results.length-1].isFinal) sendText();
 };
 rec.onerror=e=>{status.textContent='Microphone error: '+e.error;mic.textContent='🎤'};
 rec.onend=()=>{mic.textContent='🎤'};
 mic.onclick=()=>{try{rec.start()}catch(e){rec.stop()}};
}else{
 mic.disabled=true;status.textContent='Speech recognition is unavailable in this browser. Try Chrome on Android.';
}
</script>
</body>
</html>
