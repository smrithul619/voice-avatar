<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Assistant</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 16px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #answer {
      margin-top: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI Voice Assistant</h1>
    <p>Ask me anything, just like ChatGPT!</p>

    <input
      id="question"
      type="text"
      placeholder="Type your question here"
    >

    <br>

    <button id="askButton">Ask AI</button>
    <button id="micButton">🎤 Speak</button>

    <div id="answer" aria-live="polite"></div>
  </div>

  <script>
    // Replace this with your actual Cloudflare Worker URL.
    const WORKER_URL =
      "https://shiny-boat-555f.smrithul79.workers.dev";

    const questionInput = document.getElementById("question");
    const answerDiv = document.getElementById("answer");
    const askButton = document.getElementById("askButton");
    const micButton = document.getElementById("micButton");

    async function askAI(question) {
      if (!question.trim()) {
        answerDiv.textContent = "Please enter a question.";
        return;
      }

      if (WORKER_URL.includes("YOUR-WORKER-NAME")) {
        answerDiv.textContent =
          "Please configure your Cloudflare Worker URL first.";
        return;
      }

      askButton.disabled = true;
      answerDiv.textContent = "Thinking...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "The AI request failed.");
        }

        const answer = data.answer;

        if (!answer) {
          throw new Error("The AI returned an empty answer.");
        }

        answerDiv.textContent = answer;

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();

          const speech = new SpeechSynthesisUtterance(answer);
          speech.lang = "en-IN";

          window.speechSynthesis.speak(speech);
        }
      } catch (error) {
        answerDiv.textContent =
          "Unable to connect to AI. Please check your Worker URL, " +
          "deployment, and browser connection.";
      } finally {
        askButton.disabled = false;
      }
    }

    askButton.addEventListener("click", function () {
      askAI(questionInput.value);
    });

    questionInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        askAI(questionInput.value);
      }
    });

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      micButton.addEventListener("click", function () {
        try {
          recognition.start();
          answerDiv.textContent = "Listening...";
        } catch (error) {
          answerDiv.textContent =
            "Microphone is busy. Please try again.";
        }
      });

      recognition.onresult = function (event) {
        const spokenQuestion =
          event.results[0][0].transcript;

        questionInput.value = spokenQuestion;
        askAI(spokenQuestion);
      };

      recognition.onerror = function () {
        answerDiv.textContent =
          "Microphone error. Please allow microphone access " +
          "or type your question instead.";
      };
    } else {
      micButton.disabled = true;
      micButton.textContent = "Microphone unavailable";
    }
  </script>
</body>
</html>
